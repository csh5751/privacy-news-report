name: Update News Report

on:
  workflow_dispatch:
  # 코드를 고치면 바로 반영한다. 이게 없으면 다음 예약 실행까지 낡은 페이지가 남는다.
  push:
    branches: [main]
  schedule:
    # GitHub cron은 UTC 기준: 23:40 UTC = 다음 날 08:40 KST
    - cron: "40 23 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        # 키가 없으면 Claude 큐레이션을 건너뛰고 휴리스틱으로 생성된다.
        # ANTHROPIC_WORKSPACE_ID는 조직의 identity-linked 키를 쓸 때만 필요하다.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: python generate_site.py --output site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
