name: Update News Report

on:
  workflow_dispatch:
  # 코드를 고치면 페이지를 바로 반영한다. 브리핑은 보내지 않는다.
  push:
    branches: [main]
  schedule:
    # GitHub cron은 UTC 기준: 23:40 UTC = 다음 날 08:40 KST
    - cron: "40 23 * * *"

permissions:
  # 전송 이력을 리포에 커밋해 실행 사이에 이어간다.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      # 실행 사이에 이어갈 전송 이력. 이 파일이 있어야 같은 기사를 두 번 보내지 않는다.
      NEWS_HISTORY_FILE: data/sent_articles.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 예약 실행과 수동 실행만 브리핑을 보낸다. 커밋마다 채널에 알림이
      # 가면 안 되므로 push로 돌 때는 페이지만 다시 만든다.
      - name: Generate report and send briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python app.py --site site/index.html --no-teams -n 30
          else
            python app.py --site site/index.html -n 30
          fi

      - name: Commit sent history
        run: |
          # 아직 추적되지 않는 첫 실행도 잡아야 하므로 diff가 아닌 status로 본다.
          if [ -z "$(git status --porcelain -- "$NEWS_HISTORY_FILE")" ]; then
            echo "이력에 변화가 없어 커밋을 건너뜁니다."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$NEWS_HISTORY_FILE"
          git commit -m "Record briefed articles [skip ci]"
          # 다른 실행이 먼저 밀어 넣었을 수 있으니 다시 맞춘 뒤 올린다.
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
